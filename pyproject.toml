[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "colharmonize"
version = "0.1.0.dev0"
description = "Decide which metadata columns pool across datasets and what they mean in the ontology"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Carter Larsen" }]
dependencies = [
  # MetaMend (formerly GEOmend) prepares the data; colharmonize talks to it only
  # through metamend_bridge.py. Until MetaMend is published under its new name,
  # it installs from the sibling checkout (see [tool.uv.sources]).
  "metamend>=0.0.10",
  "pandas>=2.2",
  "pyarrow>=15",
  "numpy>=1.26",
  "pydantic>=2.6",
  # candidates: embedding retrieval, and ZOOMA/OLS4 lookups when --remote is given
  "sentence-transformers>=3.0",
  "requests>=2.31",
]

[tool.uv.sources]
metamend = { path = "../GEOmend", editable = true }

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
colharmonize = "colharmonize.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/colharmonize"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
